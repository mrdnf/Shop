# Public discovery for shop.syseagles.com. Installed as a root-managed copy.
add_header X-Robots-Tag $seo_shop_robots always;
add_header Link '<https://shop.syseagles.com/.well-known/api-catalog>; rel="api-catalog", <https://shop.syseagles.com/llms.txt>; rel="describedby"; type="text/plain", <https://shop.syseagles.com/sitemap.xml>; rel="sitemap"; type="application/xml"' always;
add_header Vary Accept always;
error_page 418 = @seo_shop_markdown;
if ($seo_shop_markdown != "") { return 418; }
location @seo_shop_markdown {
    root /home/shop/htdocs/shop.syseagles.com/deploy/discovery/public;
    try_files /$seo_shop_markdown =404;
    types { }
    default_type text/markdown;
    add_header Vary Accept always;
    add_header X-Robots-Tag $seo_shop_robots always;
    add_header Link '<https://shop.syseagles.com/.well-known/api-catalog>; rel="api-catalog", <https://shop.syseagles.com/llms.txt>; rel="describedby"; type="text/plain", <https://shop.syseagles.com/sitemap.xml>; rel="sitemap"; type="application/xml"' always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
