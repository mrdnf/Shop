map $http_accept $seo_shop_accept {
    default 0;
    "~*text/markdown\s*;\s*q=0(?:\.0*)?(?:\s*,|\s*$)" 0;
    "~*text/markdown" 1;
}
map "$scheme:$seo_shop_accept:$uri" $seo_shop_markdown {
    default "";
    "~^https:1:/$" "markdown/home.md";
    "~^https:1:/about/$" "about.md";
    "~^https:1:/platform/login$" "markdown/login.md";
}
map $request_uri $seo_shop_robots {
    default "noindex, nofollow";
    "~^/about/$" "index, follow, max-image-preview:large";
    "~^/$" "index, follow, max-image-preview:large";
}
